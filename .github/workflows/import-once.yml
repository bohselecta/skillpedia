name: Verified initial source import
on:
  push:
    branches: ['release/1.0.0-corporate-skills']
    paths: ['.source-transfer/READY']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'bohselecta/skillpedia' && github.ref == 'refs/heads/release/1.0.0-corporate-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify transport bytes and expand only the authored source
        run: |
          python - <<'PY'
          import base64, hashlib, io, pathlib, tarfile
          root = pathlib.Path.cwd()
          transfer = root / '.source-transfer'
          expected_names = {f'part-{i:02d}.b64' for i in range(11)} | {'READY'}
          assert {p.name for p in transfer.iterdir()} == expected_names, 'Unexpected transport files'
          expected = 'f511bc2dab3e53ed2a86f818e0b61155483b31b5c1d912ab13193f84c589ad4e'
          assert (transfer/'READY').read_text().strip() == expected
          encoded = ''.join((transfer/f'part-{i:02d}.b64').read_text().strip() for i in range(11))
          raw = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(raw).hexdigest() == expected, 'Source transport checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as archive:
              members = archive.getmembers()
              assert len(members) == 62 and sum(m.size for m in members) < 2000000
              assert len({m.name for m in members}) == len(members)
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in {'.git', '.source-transfer', 'native', 'dist'}
                  assert member.name != '.github/workflows/import-once.yml'
                  target = root / path
                  assert not any(p.is_symlink() for p in [target, *target.parents])
                  data = archive.extractfile(member).read()
                  if target.exists():
                      assert target.read_bytes() == data, f'Existing source conflict: {path}'
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with target.open('xb') as stream:
                          stream.write(data)
          print('Verified 62 authored files. No company data, model calls or account changes.')
          PY
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build.py
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py --check
      - name: Publish checked source and remove the one-time transport
        env:
          IMPORT_BASE: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/release/1.0.0-corporate-skills | cut -f1)" = "$IMPORT_BASE"
          python - <<'PY'
          import json, os, pathlib, platform, shutil
          root = pathlib.Path.cwd()
          record = {'transport_sha256':'f511bc2dab3e53ed2a86f818e0b61155483b31b5c1d912ab13193f84c589ad4e', 'import_base':os.environ['IMPORT_BASE'], 'python':platform.python_version(), 'source_fingerprint':json.loads((root/'native/MANIFEST.json').read_text())['source_fingerprint'], 'checks':'Build, structure validation, unit tests and reproducibility commands succeeded before this record was written', 'native_host_behavior':'NOT_RUN', 'scope':'Requested repository release branch only; no corporate systems or provider calls'}
          (root/'evidence/source-import.json').write_text(json.dumps(record,indent=2)+'\n')
          shutil.rmtree(root/'.source-transfer')
          (root/'.github/workflows/import-once.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deliver Skillpedia and Hoyt skills with tested native packages and source'
          git push origin HEAD:release/1.0.0-corporate-skills
