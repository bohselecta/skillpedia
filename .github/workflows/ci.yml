name: Offline acceptance
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skillpedia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 checked 2026-09-30
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Build all native targets and upload archives
        run: python tools/build.py
      - name: Validate single-skill bundles and plugin structure
        run: python tools/validate.py
      - name: Execute helper, failure, schema and isolation tests
        run: python -m unittest discover -s tests -v
      - name: Verify reproducible artifacts and no source drift
        run: |
          python tools/build.py --check
          git diff --exit-code -- src schemas fixtures tools native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.python == '3.13'
        with:
          name: install-packs-${{ github.sha }}
          path: dist/*-UNZIP-FIRST-*.zip
          if-no-files-found: error
          retention-days: 14
