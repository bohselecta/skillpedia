<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="t d"><title id="t">Two environments, one reviewed method bridge</title><desc id="d">Hoyt personal ChatGPT holds only personal, public or released inputs. Skillpedia in corporate Claude holds approved work context. A human-reviewed generic method may cross the boundary; messages, rosters and work state do not sync.</desc>
<rect width="1400" height="410" rx="24" fill="#edf2ef"/><g font-family="Arial,sans-serif"><text x="48" y="61" font-size="27" font-weight="700" fill="#162b3b">Two environments. No silent crossover.</text>
<rect x="45" y="96" width="427" height="244" rx="18" fill="#172a3a"/><text x="75" y="143" font-size="31" font-weight="700" fill="#f6f1e9">hoyt</text><text x="75" y="183" font-size="22" fill="#77dbca">Personal ChatGPT · 16 skills</text><text x="75" y="233" font-size="20" fill="#e0e8e9">Personal / public / released inputs</text><text x="75" y="267" font-size="20" fill="#e0e8e9">Private roster and work habits</text><text x="75" y="306" font-size="17" fill="#b8ccd0">No employer inbox connection by default</text>
<rect x="928" y="96" width="427" height="244" rx="18" fill="#172a3a"/><text x="958" y="143" font-size="31" font-weight="700" fill="#f6f1e9">skillpedia</text><text x="958" y="183" font-size="22" fill="#77dbca">Corporate Claude · 20 skills</text><text x="958" y="233" font-size="20" fill="#e0e8e9">Approved work account and sources</text><text x="958" y="267" font-size="20" fill="#e0e8e9">Evidence stays in the work system</text><text x="958" y="306" font-size="17" fill="#b8ccd0">Actual company policy governs access</text>
<path d="M490 214H560M840 214H910" stroke="#4c807a" stroke-width="3"/><path d="m500 207-10 7 10 7m400-14 10 7-10 7" fill="none" stroke="#4c807a" stroke-width="3"/><rect x="553" y="145" width="294" height="138" rx="17" fill="#d9e9e2" stroke="#7aafa3"/><text x="700" y="186" text-anchor="middle" font-size="21" font-weight="700" fill="#234f49">Human-reviewed bridge</text><text x="700" y="221" text-anchor="middle" font-size="19" fill="#234f49">Generic method only</text><text x="700" y="253" text-anchor="middle" font-size="17" fill="#234f49">Exact content + release authority</text><text x="700" y="375" text-anchor="middle" font-size="20" fill="#52636d">No inbox, people record, customer data or project-state synchronization.</text></g></svg>
